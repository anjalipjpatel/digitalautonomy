services:
  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    container_name: api
    environment:
      - PORT=8080
    ports:
      - "8080:8080"
  
  # Mock Payment Initiation API (OBIE compliant)
  payment-api:
    build:
      context: ./mock-services/payment
    container_name: payment-api
    ports: 
      - "3001:3000"

  # Mock Account + Transaction API (OBIE compliant)
  account-api:
    build:
      context: ./mock-services/account
    container_name: account-api
    ports:
      - "3002:3000"
  
  # Mock Event Notification API (OBIE compliant)
  event-notification-api:
    build:
      context: ./mock-services/events
    container_name: event-notification-api
    ports:
      - "3003:3000"

  # DB
  db:
    build:
      context: ./db
      dockerfile: Dockerfile
    container_name: db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  adminer:
    image: adminer:latest
    container_name: adminer_ui
    ports:
      - "8081:8080"
    restart: unless-stopped

volumes:
  postgres_data: