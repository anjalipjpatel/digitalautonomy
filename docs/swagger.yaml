basePath: /
definitions:
  api.createUserRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
      role:
        type: string
    type: object
  api.loginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  user.Role:
    enum:
    - vulnerable_owner
    - delegate
    - admin
    type: string
    x-enum-varnames:
    - RoleVulnerableOwner
    - RoleDelegate
    - RoleAdmin
  user.User:
    properties:
      createdAt:
        type: string
      email:
        type: string
      id:
        type: string
      name:
        type: string
      role:
        $ref: '#/definitions/user.Role'
    type: object
info:
  contact: {}
  description: API for the digital autonomy prototype.
  title: Digital Autonomy API
  version: "1.0"
paths:
  /health:
    get:
      description: Returns OK when the API is running.
      produces:
      - text/plain
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: Check API health
      tags:
      - health
  /login:
    post:
      consumes:
      - application/json
      description: Validate login credentials and authorise access to the system.
      parameters:
      - description: Login details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Login successful
          schema:
            $ref: '#/definitions/user.User'
        "400":
          description: Invalid JSON body
          schema:
            type: string
        "401":
          description: Invalid email or password
          schema:
            type: string
        "500":
          description: Could not log in
          schema:
            type: string
      summary: Login to system
      tags:
      - auth
  /me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: User
          schema:
            $ref: '#/definitions/user.User'
        "401":
          description: Invalid cookie
          schema:
            type: string
        "404":
          description: Unknown user
          schema:
            type: string
      summary: Return the current user.
      tags:
      - users
  /users:
    post:
      consumes:
      - application/json
      description: Creates a user account.
      parameters:
      - description: User details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.createUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: User created
          schema:
            $ref: '#/definitions/user.User'
        "400":
          description: Invalid JSON body or user details
          schema:
            type: string
        "409":
          description: Email already registered
          schema:
            type: string
        "500":
          description: Could not create user
          schema:
            type: string
      summary: Create a user
      tags:
      - users
swagger: "2.0"
